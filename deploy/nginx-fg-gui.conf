# nginx als Reverse-Proxy vor Streamlit (TLS + Basic-Auth). Streamlit selbst hat keine Anmeldung.
# /etc/nginx/conf.d/fg-gui.conf; Passwortdatei: htpasswd -c /etc/nginx/fg-gui.htpasswd <benutzer>
# SELinux (AlmaLinux): setsebool -P httpd_can_network_connect 1
server {
    listen 443 ssl;
    server_name fg-gui.example.org;                       # anpassen

    ssl_certificate     /etc/pki/tls/certs/fg-gui.crt;    # anpassen
    ssl_certificate_key /etc/pki/tls/private/fg-gui.key;

    client_max_body_size 200m;                            # = server.maxUploadSize

    auth_basic           "FourierGrating";
    auth_basic_user_file /etc/nginx/fg-gui.htpasswd;

    location / {
        proxy_pass http://herkules3.ito.uni-stuttgart.de:8505;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User $remote_user;      # = FG_GUI_USER_HEADER; überschreibt vom Client gesendete Werte
        proxy_set_header Upgrade $http_upgrade;           # WebSocket (/_stcore/stream)
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
