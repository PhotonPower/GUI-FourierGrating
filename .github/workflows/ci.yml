name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ohne FourierGrating: die Tests ersetzen das Paket durch ein Ersatzmodul (tests/conftest.py)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest -q
